# =============================================================================
# The Threshold — canonical REAL-SITE metadata (non-geometric)
# Companion to site.geojson (geometry / parcel boundary).
# =============================================================================
# PROVENANCE DISCIPLINE (SPEC.md §Provenance): every attribute carries one tag.
#   [VERIFIED]           measured / provided by survey or authoritative source
#   [OBSERVED]           seen on site visit / aerial, not instrument-measured
#   [SECONDARY]          from a secondary document (report, plan, GIS layer)
#   [DESIGN HYPOTHESIS]  inferred by the design/research team, not yet measured
#   [TO VERIFY]          unknown; placeholder only — MUST be confirmed, never
#                        treated as fact. Missing info is NEVER fabricated.
# -----------------------------------------------------------------------------
site:
  id: bantargebang_threshold_site
  name: "The Threshold — Bantargebang experimental site"
  location: "Bantargebang, Bekasi, West Java, Indonesia"   # [SECONDARY]
  provenance: "[SECONDARY]"
  reference_area_m2: 5533.85     # design-brief reference area  [PA5 CORPUS / DESIGN HYPOTHESIS]
  measured_area_m2: 5634.09      # derived from site.geojson polygon [DESIGN HYPOTHESIS]
  notes: >
    Geometry (parcel boundary) is taken from site.geojson and is treated as the
    single source of truth for shape. All attributes below are NON-geometric
    metadata. Where a value is not yet evidenced it is tagged [TO VERIFY] and
    left null rather than invented.

# --- Orientation -----------------------------------------------------------
orientation:
  north_reference: "WGS84_geographic_north"
  provenance: "[SECONDARY]"
  notes: "Coordinate north follows the supplied GeoJSON; solar performance needs climate and section studies."

# --- Frontage / access anchors ---------------------------------------------
# Geometry for anchors lives in site.geojson-derived local coords (metres).
# Here we record EXISTENCE + provenance. Coordinates are filled only when known.
frontage:
  public_arrival:
    present: true
    edge_indices: [7]
    provenance: "[VERIFIED]"
    notes: "User-specified southern segment (107.0082724,-6.3505665) to (107.008038,-6.350512); entire segment is the arrival zone. No gate point is known."
  primary_street:
    present: null
    edge_indices: []
    provenance: "[TO VERIFY]"
    notes: "Road hierarchy and exact road-side condition need site verification."
  secondary_street:
    present: null
    edge_indices: []
    provenance: "[TO VERIFY]"

access:
  public_entry:
    present: null
    edge_indices: [7]
    provenance: "[TO VERIFY]"
    notes: "Exact gate point unknown; use the full edge-7 arrival segment as a zone."
  service_entry:
    present: null
    edge_indices: []
    provenance: "[TO VERIFY]"
    notes: "Service / TPST-facing access anchor; not yet located."
  emergency_access:
    present: null
    edge_indices: []
    provenance: "[TO VERIFY]"

# --- Operational / contextual edges ----------------------------------------
context:
  tpst_facing_edge:
    present: null
    edge_indices: []
    provenance: "[TO VERIFY]"
    notes: "Edge toward TPST Bantargebang (waste facility) — nuisance/exposure source."
  settlement_edge:
    present: null
    edge_indices: []
    provenance: "[TO VERIFY]"
    notes: "Edge abutting existing settlement / kampung fabric."
  preferred_expansion_direction:
    direction: null
    provenance: "[TO VERIFY]"
    notes: "No preferred direction until full contextual evidence is available; south is the primary arrival edge."

context_layers:
  public_frontage: { present: true, edge_indices: [7], provenance: "[VERIFIED]" }
  public_arrival: { present: true, edge_indices: [7], provenance: "[VERIFIED]" }
  possible_service_access: { present: null, edge_indices: [], provenance: "[TO VERIFY]" }
  settlement_facing_edges: { present: null, edge_indices: [], provenance: "[TO VERIFY]" }
  tpst_facing_edges: { present: null, edge_indices: [], provenance: "[TO VERIFY]" }
  road_hierarchy: { present: null, provenance: "[TO VERIFY]" }
  solar_orientation: { present: true, provenance: "[SECONDARY]", notes: "Coordinate north only; no measured insolation." }
  prevailing_wind: { present: null, provenance: "[TO VERIFY]" }
  noise: { present: null, edge_indices: [], provenance: "[TO VERIFY]" }
  odour: { present: null, edge_indices: [], provenance: "[TO VERIFY]" }
  dust: { present: null, edge_indices: [], provenance: "[TO VERIFY]" }
  drainage_flooding: { present: null, provenance: "[TO VERIFY]" }
  vegetation: { present: null, provenance: "[TO VERIFY]" }
  existing_obstacles: { present: null, provenance: "[TO VERIFY]" }
  landscape_opportunity: { present: null, provenance: "[TO VERIFY]" }
  future_expansion: { present: null, provenance: "[TO VERIFY]" }

# --- Existing site features -------------------------------------------------
existing_features:
  obstacles:    { present: null, provenance: "[TO VERIFY]", notes: "Structures to retain/demolish." }
  vegetation:   { present: null, provenance: "[TO VERIFY]", notes: "Existing trees / planting to keep." }
  drainage:     { present: null, provenance: "[TO VERIFY]", notes: "Drainage lines / low points / flood risk." }

# --- Environmental exposure --------------------------------------------------
environmental_exposure:
  noise_source:   { edge_indices: [], provenance: "[TO VERIFY]", notes: "e.g. TPST haul road." }
  odour_source:   { edge_indices: [], provenance: "[TO VERIFY]", notes: "Prevailing-wind odour from TPST." }
  dust_source:    { edge_indices: [], provenance: "[TO VERIFY]" }
  prevailing_wind_direction: { direction: null, provenance: "[TO VERIFY]" }
  solar_notes:    { provenance: "[DESIGN HYPOTHESIS]", notes: "Tropical ~6°S: high sun, shade critical; east/west heat gain to control." }

# --- Setbacks / buffers -------------------------------------------------------
# Depths are SCHEMATIC search defaults, not statutory values.
setbacks:
  front_m:     { value: 4.0, provenance: "[DESIGN HYPOTHESIS]", notes: "Arrival/threshold band on frontage." }
  side_m:      { value: 3.0, provenance: "[DESIGN HYPOTHESIS]" }
  rear_m:      { value: 3.0, provenance: "[DESIGN HYPOTHESIS]" }
  tpst_buffer_m: { value: 10.0, provenance: "[DESIGN HYPOTHESIS]", notes: "Extra green buffer to nuisance edge." }
  notes: "Confirm against local building regulation (RDTR / KDB) — [TO VERIFY]."

# --- Future contextual layers -------------------------------------------------
future_layers:
  planned_roads:    { present: null, provenance: "[TO VERIFY]" }
  easements:        { present: null, provenance: "[TO VERIFY]" }
  flood_overlay:    { present: null, provenance: "[TO VERIFY]" }
